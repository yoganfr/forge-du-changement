name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Verify src + web
        run: node scripts/check-api-exports.mjs && npm run build && npm run --prefix web build
