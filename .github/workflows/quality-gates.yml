name: Quality Gates

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install web deps
        run: npm ci --prefix web

      - name: Verify src + web
        run: node scripts/check-api-exports.mjs && npm run build && npm run --prefix web build

      - name: Report dependency alerts
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev
          root=$?
          npm audit --omit=dev --prefix web
          web=$?
          if [ "$root" -ne 0 ] || [ "$web" -ne 0 ]; then
            exit 1
          fi
